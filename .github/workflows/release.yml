name: Build & Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  # Read-only by default; the `release` job (attaches installers and the
  # apt index to the GitHub Release) elevates to write.
  contents: read

jobs:
  # Large-file guard: GitHub hard-rejects any push containing a file over
  # 100 MiB (even if it only exists in history), and warns at 50 MiB. Scan
  # every tracked file on EVERY push so an oversized resource fails here
  # with a clear annotation instead of a confusing push rejection — and
  # gate the installer builds on it, so a release can never be built from
  # a tree that couldn't be pushed in the first place.
  check-file-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any tracked file exceeds GitHub's 100 MB limit
        run: |
          hard_limit=$((100 * 1024 * 1024))
          warn_limit=$((50 * 1024 * 1024))
          fail=0
          while IFS= read -r -d '' file; do
            size=$(stat -c %s "$file")
            if [ "$size" -gt "$hard_limit" ]; then
              echo "::error::$file is $(numfmt --to=iec "$size") — exceeds GitHub's 100 MB per-file limit; the push would be rejected. Move it out of the repo (e.g. attach it to a Release instead)."
              fail=1
            elif [ "$size" -gt "$warn_limit" ]; then
              echo "::warning::$file is $(numfmt --to=iec "$size") — approaching GitHub's 100 MB per-file limit."
            fi
          done < <(git ls-files -z)
          exit "$fail"

  # Desktop unit tests (pure logic: search matching, note parser, Bible
  # catalog aliasing, copy formatting) run on EVERY push to any branch.
  # The installer jobs below additionally depend on this job, so a broken
  # test also blocks a release build.

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run desktop unit tests
        run: ./gradlew desktopTest --no-daemon

  # Each installer must be built on its native OS — the Compose Gradle
  # plugin cannot cross-compile MSI / DMG (MSI needs Windows + WiX, DMG
  # needs macOS + hdiutil). Build on three native runners, upload the
  # installers as artifacts, and attach everything in one final job.
  # The branch pushes above only run the `test` job; the builds below
  # stay limited to version tags.

  build-deb:
    needs: [test, check-file-sizes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build .deb package
        run: ./gradlew packageDeb --no-daemon

      # Generate the apt Packages index NEXT TO the .deb so the release
      # job attaches index + installer together. The Filename field is a
      # RELATIVE path (just the deb's file name): apt always resolves
      # Filename against the repository base URI — it never honors an
      # absolute URL there (a flat repo would concatenate the base onto
      # it and 404). Both files are served from the same base URI, the
      # GitHub Release download URL, so the resolution just works.
      - name: Generate apt Packages index
        run: |
          set -euo pipefail
          DEB=$(ls build/compose/binaries/main/deb/*.deb | head -1)
          PKG=$(dpkg-deb -f "$DEB" Package)
          VER=$(dpkg-deb -f "$DEB" Version)
          ARCH=$(dpkg-deb -f "$DEB" Architecture)
          SIZE=$(stat -c %s "$DEB")
          SHA=$(sha256sum "$DEB" | awk '{print $1}')
          OUT=build/compose/binaries/main/deb
          printf 'Package: %s\nVersion: %s\nArchitecture: %s\nFilename: %s\nSize: %s\nSHA256: %s\n' \
            "$PKG" "$VER" "$ARCH" "$(basename "$DEB")" "$SIZE" "$SHA" > "$OUT/Packages"
          gzip -9kn "$OUT/Packages"
          echo "Indexed $PKG $VER ($ARCH) -> $(basename "$DEB")"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: build/compose/binaries/main/deb/

  build-msi:
    needs: [test, check-file-sizes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build .msi package
        # WiX Toolset is downloaded automatically by the Compose plugin.
        shell: bash
        run: ./gradlew packageMsi --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: build/compose/binaries/main/msi/*.msi

  build-dmg:
    needs: [test, check-file-sizes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build .dmg package
        run: ./gradlew packageDmg --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: build/compose/binaries/main/dmg/*.dmg

  release:
    needs: [build-deb, build-msi, build-dmg]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: installers/**
          generate_release_notes: true


