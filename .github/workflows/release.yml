name: Build & Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  # Read-only by default; the `release` job (attaches installers and the
  # apt index to the GitHub Release) elevates to write.
  contents: read

jobs:
  # Large-file guard: GitHub hard-rejects any push containing a file over
  # 100 MiB (even if it only exists in history), and warns at 50 MiB. Scan
  # every tracked file on EVERY push so an oversized resource fails here
  # with a clear annotation instead of a confusing push rejection — and
  # gate the installer builds on it, so a release can never be built from
  # a tree that couldn't be pushed in the first place.
  check-file-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any tracked file exceeds GitHub's 100 MB limit
        run: |
          hard_limit=$((100 * 1024 * 1024))
          warn_limit=$((50 * 1024 * 1024))
          fail=0
          while IFS= read -r -d '' file; do
            size=$(stat -c %s "$file")
            if [ "$size" -gt "$hard_limit" ]; then
              echo "::error::$file is $(numfmt --to=iec "$size") — exceeds GitHub's 100 MB per-file limit; the push would be rejected. Move it out of the repo (e.g. attach it to a Release instead)."
              fail=1
            elif [ "$size" -gt "$warn_limit" ]; then
              echo "::warning::$file is $(numfmt --to=iec "$size") — approaching GitHub's 100 MB per-file limit."
            fi
          done < <(git ls-files -z)
          exit "$fail"

  # Desktop unit tests (pure logic: search matching, note parser, Bible
  # catalog aliasing, copy formatting) run on EVERY push to any branch.
  # The installer jobs below additionally depend on this job, so a broken
  # test also blocks a release build.

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run desktop unit tests
        run: ./gradlew desktopTest --no-daemon

  # Each installer must be built on its native OS — the Compose Gradle
  # plugin cannot cross-compile MSI / DMG (MSI needs Windows + WiX, DMG
  # needs macOS + hdiutil). Build on three native runners, upload the
  # installers as artifacts, and attach everything in one final job.
  # The branch pushes above only run the `test` job; the builds below
  # stay limited to version tags.

  build-deb:
    needs: [test, check-file-sizes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build .deb package
        run: ./gradlew packageDeb --no-daemon

      # Generate the apt Packages index NEXT TO the .deb so the release
      # job attaches index + installer together. The Filename field is a
      # RELATIVE path (just the deb's file name): apt always resolves
      # Filename against the repository base URI — it never honors an
      # absolute URL there (a flat repo would concatenate the base onto
      # it and 404). Both files are served from the same base URI, the
      # GitHub Release download URL, so the resolution just works.
      - name: Generate apt Packages index
        run: |
          set -euo pipefail
          DEB=$(ls build/compose/binaries/main/deb/*.deb | head -1)
          PKG=$(dpkg-deb -f "$DEB" Package)
          VER=$(dpkg-deb -f "$DEB" Version)
          ARCH=$(dpkg-deb -f "$DEB" Architecture)
          SIZE=$(stat -c %s "$DEB")
          SHA=$(sha256sum "$DEB" | awk '{print $1}')
          OUT=build/compose/binaries/main/deb
          printf 'Package: %s\nVersion: %s\nArchitecture: %s\nFilename: %s\nSize: %s\nSHA256: %s\n' \
            "$PKG" "$VER" "$ARCH" "$(basename "$DEB")" "$SIZE" "$SHA" > "$OUT/Packages"
          gzip -9kn "$OUT/Packages"
          echo "Indexed $PKG $VER ($ARCH) -> $(basename "$DEB")"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: build/compose/binaries/main/deb/

  build-msi:
    needs: [test, check-file-sizes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build .msi package
        # WiX Toolset is downloaded automatically by the Compose plugin.
        shell: bash
        run: ./gradlew packageMsi --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: build/compose/binaries/main/msi/*.msi

  build-dmg:
    needs: [test, check-file-sizes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build .dmg package
        run: ./gradlew packageDmg --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: build/compose/binaries/main/dmg/*.dmg

  # Phone app (Android): builds a debug APK on EVERY branch push so the
  # mobile project can't rot, and a RELEASE build on version tags. Release
  # builds are signed when the Android signing secrets are present; without
  # them the job still succeeds, signed with the debug key, and prints a
  # warning. The APK is uploaded as an artifact and attached to the GitHub
  # Release by the `release` job below.
  build-android:
    needs: [test, check-file-sizes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      # Write mobile/keystore.properties from repository secrets. Only on
      # tags: a release keystore is never needed for a branch build.
      - name: Write release signing config
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # A published APK must never be debug-signed: fail the tag build
          # loudly instead of quietly attaching a debug-key APK.
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] \
             || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Signed release APK needs ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: mobile
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: mobile
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK signing certificate
        working-directory: mobile
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "Built $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/apk-certs.txt

      # Publishing safety net: the tag build fails if the certificate is the
      # shared Android debug key rather than the release key.
      - name: Assert release APK is not debug-signed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if grep -q "CN=Android Debug" /tmp/apk-certs.txt; then
            echo "::error::The release APK is debug-signed. Add the Android signing secrets and re-run."
            exit 1
          fi
          grep -m1 "certificate DN" /tmp/apk-certs.txt

      # Flatten the APK into its own directory so the artifact lands at the
      # root when the release job merges it with the desktop installers
      # (gh release upload installers/* only globs files), give it a
      # user-facing asset name, and write its SHA-256 checksum next to it.
      - name: Collect APK + checksum
        working-directory: mobile
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          mkdir -p build/apk-out
          if [ "$REF_TYPE" = "tag" ]; then
            APK_NAME=JasonBible-phone.apk
            SRC=app/build/outputs/apk/release/app-release.apk
          else
            APK_NAME=JasonBible-phone-debug.apk
            SRC=app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SRC" "build/apk-out/$APK_NAME"
          ( cd build/apk-out && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          cat "build/apk-out/$APK_NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            mobile/build/apk-out/*.apk
            mobile/build/apk-out/*.sha256
          if-no-files-found: error

  release:
    needs: [build-deb, build-msi, build-dmg, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The checksum file was written by the Android job; verify the APK
      # against it before it is published.
      - name: Verify APK checksum
        run: |
          set -euo pipefail
          cd installers
          sha256sum -c JasonBible-phone.apk.sha256

      # One checksum file covering every release asset (APK + desktop
      # installers), attached alongside them.
      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd installers
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' \
            -exec sha256sum {} + \
            | sed 's|  \./|  |' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Upload with the `gh` CLI rather than softprops/action-gh-release.
      # When the release for the tag already exists (a re-run, or a release
      # created by an earlier attempt) that action re-sends the release's
      # original `target_commitish` in an update call, which GitHub refuses
      # for GITHUB_TOKEN with 403 "Resource not accessible by integration"
      # as soon as the tagged commit's workflow files differ from the default
      # branch's. `gh release upload` only touches assets, so it is safe to
      # re-run, and `--clobber` gives us overwrite_files semantics.
      - name: Attach installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets to it."
          else
            # Notes are generated from the commits since the previous tag.
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" installers/* --clobber


