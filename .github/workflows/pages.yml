name: Deploy README site

on:
  push:
    branches: [main]
    paths:
      - "docs/readme/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish site to gh-pages
        run: |
          set -euo pipefail

          git fetch origin gh-pages
          git worktree add --detach site origin/gh-pages

          cp docs/readme/index.html site/
          cp docs/readme/style.css site/
          cp docs/readme/script.js site/
          cp docs/readme/icon.png site/
          mkdir -p site/screenshots
          cp docs/readme/screenshots/*.png site/screenshots/

          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css script.js icon.png screenshots/

          if git diff --cached --quiet; then
            echo "Site is already up to date."
            exit 0
          fi

          git commit -m "Deploy README site"
          git push origin HEAD:gh-pages
